name: Build and push to Forgejo Packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish'
        type: string
        required: false
        default: 'manual'

jobs:
  docker:
    runs-on: office-server-amd64-ubuntu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      # ui/ui.go embeds ui/dist (gitignored); a placeholder index.html satisfies it.
      # The real UI is built inside the Dockerfile.
      - name: Run unit tests
        run: |
          mkdir -p ui/dist
          echo '<!doctype html>' > ui/dist/index.html
          go test ./...

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Forgejo Container Registry
        uses: docker/login-action@v3
        with:
          registry: git.xd003.cc
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_PAT }}

      - name: Determine build metadata
        id: vars
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          echo "tag=${INPUT_TAG:-manual}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.vars.outputs.tag }}
            COMMIT=${{ steps.vars.outputs.commit }}
            BUILD_DATE=${{ steps.vars.outputs.date }}
          tags: |
            git.xd003.cc/${{ github.repository }}:${{ steps.vars.outputs.tag }}
            git.xd003.cc/${{ github.repository }}:latest
